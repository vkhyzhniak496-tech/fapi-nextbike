<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warszawa - Veturilo & Safe Cycleways</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="info-box">
        <span class="pulse"></span><b>Veturilo 3.0 Live</b><br/>
        <b>Aktualizacja:</b> <span id="last-update-label">Ładowanie...</span><br/>
        <a href="/leaderboard" class="btn-nav-leaderboard">🏆 Zobacz Ranking Stacji</a>
    </div>

    <div id="legend">
        <div class="legend-title">Infrastruktura rowerowa</div>
        <div class="legend-item">
            <span class="legend-line" style="background: #27ae60;"></span>
            <span>Wydzielona droga (DDR)</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background: #2980b9;"></span>
            <span>Strefa zamieszkania / Woonerf</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background: #3498db;"></span>
            <span>Ulica Tempo 30 (uspokojona)</span>
        </div>
        <hr style="margin: 6px 0; border: 0; border-top: 1px solid #eee;" />
        <div class="legend-item">
            <span class="legend-dot" style="background: #2ecc71;"></span>
            <span>Stacja (dostępne rowery)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #e74c3c;"></span>
            <span>Stacja pusta (0 rowerów)</span>
        </div>
    </div>

    <div id="map"></div>

    <script>
        function formatTime(val) {
            if (!val) return "Brak danych";
            const date = new Date(val);
            if (isNaN(date.getTime())) return "Aktualne";
            return date.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [21.012, 52.230],
            zoom: 13
        });

        // Kontrolki nawigacji w prawym górnym rogu
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserLocation: true
        }), 'top-right');

        function createPopupHTML(id, name, freeBikes, emptySlots) {
            const timestamp = new Date().getTime();
            const encodedName = encodeURIComponent(name);
            return `
                <h4 style="margin:0 0 6px 0;">${name}</h4>
                ${freeBikes !== undefined ? `🚲 Dostępne rowery: <b>${freeBikes}</b><br/>` : ''}
                ${emptySlots !== undefined ? `🅿️ Wolne stojaki: <b>${emptySlots}</b><br/>` : ''}
                <img 
                    src="/analytics/station/${id}/chart.png?name=${encodedName}&t=${timestamp}" 
                    class="station-chart-img" 
                    alt="Wykres trendu (ładowanie...)" 
                    onerror="this.style.display='none'"
                />
            `;
        }

        async function refreshBikeData() {
            try {
                const res = await fetch('/bikes/citybikes/warsaw?t=' + new Date().getTime());
                const data = await res.json();
                document.getElementById('last-update-label').innerText = formatTime(data.last_update);

                const source = map.getSource('veturilo-stations');
                if (source) {
                    source.setData(data);
                } else {
                    map.addSource('veturilo-stations', {
                        type: 'geojson',
                        data: data
                    });

                    map.addLayer({
                        id: 'stations-point',
                        type: 'circle',
                        source: 'veturilo-stations',
                        paint: {
                            'circle-radius': [
                                'interpolate', ['linear'], ['get', 'free_bikes'],
                                0, 4,
                                5, 7,
                                15, 12
                            ],
                            'circle-color': [
                                'case',
                                ['==', ['get', 'free_bikes'], 0], '#e74c3c',
                                '#2ecc71'
                            ],
                            'circle-stroke-width': 1.5,
                            'circle-stroke-color': '#ffffff'
                        }
                    });
                }
            } catch (err) {
                console.error("Błąd stacji:", err);
            }
        }

        map.on('load', () => {
            map.addSource('safe-cycleways', {
                type: 'geojson',
                data: '/network/safe-cycleways'
            });

            map.addLayer({
                id: 'cycleways-lines',
                type: 'line',
                source: 'safe-cycleways',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: {
                    'line-color': [
                        'match',
                        ['get', 'highway'],
                        'cycleway', '#27ae60',
                        'living_street', '#2980b9',
                        '#3498db'
                    ],
                    'line-width': 3,
                    'line-opacity': 0.85
                }
            });

            refreshBikeData();
            setInterval(refreshBikeData, 30000);

            // Obsługa kliknięcia w stację
            map.on('click', 'stations-point', (e) => {
                const p = e.features[0].properties;
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(createPopupHTML(p.id, p.name, p.free_bikes, p.empty_slots))
                    .addTo(map);
            });

            map.on('mouseenter', 'stations-point', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'stations-point', () => { map.getCanvas().style.cursor = ''; });

            // Obsługa przeskoku z widoku /leaderboard
            const urlParams = new URLSearchParams(window.location.search);
            const targetLat = parseFloat(urlParams.get('lat'));
            const targetLng = parseFloat(urlParams.get('lng'));
            const targetId = urlParams.get('id');
            const targetName = decodeURIComponent(urlParams.get('name') || 'Wybrana stacja');

            if (!isNaN(targetLat) && !isNaN(targetLng)) {
                map.flyTo({
                    center: [targetLng, targetLat],
                    zoom: 16,
                    essential: true
                });

                if (targetId) {
                    new maplibregl.Popup()
                        .setLngLat([targetLng, targetLat])
                        .setHTML(createPopupHTML(targetId, targetName))
                        .addTo(map);
                }
            }
        });
    </script>
</body>
</html>
