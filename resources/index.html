<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warszawa - Veturilo & Safe Cycleways</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="info-box" class="glass-panel">
        <div class="status-row">
            <span class="pulse"></span>
            <span>Veturilo 3.0 Live</span>
        </div>
        <div class="update-time">Aktualizacja: <span id="last-update-label">Ładowanie...</span></div>
        <a href="/leaderboard" class="btn-nav-leaderboard">🏆 Ranking stacji</a>
    </div>

    <!-- Interaktywny filtr warstw -->
    <div id="legend" class="glass-panel">
        <div class="legend-title">Filtruj infrastrukturę</div>
        <label class="legend-toggle">
            <input type="checkbox" id="filter-ddr" checked onchange="updateCyclewaysFilter()">
            <span class="legend-line" style="background: #27ae60;"></span>
            <span>Wydzielona droga (DDR)</span>
        </label>
        <label class="legend-toggle">
            <input type="checkbox" id="filter-lane" checked onchange="updateCyclewaysFilter()">
            <span class="legend-line" style="background: #f39c12;"></span>
            <span>Pas rowerowy w jezdni</span>
        </label>
        <label class="legend-toggle">
            <input type="checkbox" id="filter-woonerf" checked onchange="updateCyclewaysFilter()">
            <span class="legend-line" style="background: #2980b9;"></span>
            <span>Strefa zamieszkania / Woonerf</span>
        </label>
        <label class="legend-toggle">
            <input type="checkbox" id="filter-tempo30" checked onchange="updateCyclewaysFilter()">
            <span class="legend-line" style="background: #3498db;"></span>
            <span>Ulica Tempo 30 (uspokojona)</span>
        </label>
        <hr class="legend-divider" />
        <div class="legend-item">
            <span class="legend-dot" style="background: #2ecc71;"></span>
            <span>Stacja (dostępne rowery)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #e74c3c;"></span>
            <span>Stacja pusta (0 rowerów)</span>
        </div>
    </div>

    <!-- Kontener mapy MUSI być zdefiniowany przed załadowaniem skryptu -->
    <div id="map"></div>

    <!-- Skrypt umieszczony na samym końcu -->
    <script src="/static/map_view.js" defer></script>
</body>
</html>
