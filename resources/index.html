<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warszawa - Veturilo & Safe Cycleways</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        .maplibregl-popup-content {
            font-family: sans-serif;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
        }
        #info-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            line-height: 1.5;
        }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            margin-right: 5px;
        }
        #legend {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            line-height: 1.6;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-line {
            width: 20px;
            height: 4px;
            margin-right: 8px;
            border-radius: 2px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div id="info-box">
        <span class="pulse"></span><b>Veturilo 3.0 Live</b><br/>
        <b>Aktualizacja:</b> <span id="last-update-label">Ładowanie...</span><br/>
        <small style="color: #777;">Autoodświeżanie stacji co 30s</small>
    </div>

    <div id="legend">
        <div class="legend-title">Infrastruktura rowerowa</div>
        <div class="legend-item">
            <span class="legend-line" style="background: #27ae60;"></span>
            <span>Wydzielona droga (DDR)</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background: #2980b9;"></span>
            <span>Strefa zamieszkania / Woonerf</span>
        </div>
        <div class="legend-item">
            <span class="legend-line" style="background: #3498db;"></span>
            <span>Ulica Tempo 30 (uspokojona)</span>
        </div>
        <hr style="margin: 6px 0; border: 0; border-top: 1px solid #eee;" />
        <div class="legend-item">
            <span class="legend-dot" style="background: #2ecc71;"></span>
            <span>Stacja (dostępne rowery)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #e74c3c;"></span>
            <span>Stacja pusta (0 rowerów)</span>
        </div>
    </div>

    <div id="map"></div>

    <script>
        function formatTime(val) {
            if (!val) return "Brak danych";
            const date = new Date(val);
            if (isNaN(date.getTime())) return "Aktualne";
            return date.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [21.030, 52.215],
            zoom: 12.5
        });

        async function refreshBikeData() {
            try {
                const res = await fetch('/bikes/citybikes/warsaw?t=' + new Date().getTime());
                const data = await res.json();
                document.getElementById('last-update-label').innerText = formatTime(data.last_update);

                const source = map.getSource('veturilo-stations');
                if (source) {
                    source.setData(data);
                } else {
                    map.addSource('veturilo-stations', {
                        type: 'geojson',
                        data: data
                    });

                    map.addLayer({
                        id: 'stations-point',
                        type: 'circle',
                        source: 'veturilo-stations',
                        paint: {
                            'circle-radius': [
                                'interpolate', ['linear'], ['get', 'free_bikes'],
                                0, 4,
                                5, 7,
                                15, 12
                            ],
                            'circle-color': [
                                'case',
                                ['==', ['get', 'free_bikes'], 0], '#e74c3c',
                                '#2ecc71'
                            ],
                            'circle-stroke-width': 1.5,
                            'circle-stroke-color': '#ffffff'
                        }
                    });
                }
            } catch (err) {
                console.error("Błąd stacji:", err);
            }
        }

        map.on('load', () => {
            // Wczytanie lokalnego pliku z dysku
            map.addSource('safe-cycleways', {
                type: 'geojson',
                data: '/network/safe-cycleways'
            });

            map.addLayer({
                id: 'cycleways-lines',
                type: 'line',
                source: 'safe-cycleways',
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': [
                        'match',
                        ['get', 'highway'],
                        'cycleway', '#27ae60',
                        'living_street', '#2980b9',
                        '#3498db'
                    ],
                    'line-width': 3,
                    'line-opacity': 0.85
                }
            });

            refreshBikeData();
            setInterval(refreshBikeData, 30000);

            map.on('click', 'stations-point', (e) => {
                const p = e.features[0].properties;
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <h4 style="margin:0 0 6px 0;">${p.name}</h4>
                        🚲 Dostępne rowery: <b>${p.free_bikes}</b><br/>
                        🅿️ Wolne stojaki: <b>${p.empty_slots}</b>
                    `)
                    .addTo(map);
            });

            map.on('mouseenter', 'stations-point', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'stations-point', () => { map.getCanvas().style.cursor = ''; });
        });
    </script>
</body>
</html>
