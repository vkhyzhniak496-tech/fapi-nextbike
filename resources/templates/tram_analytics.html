<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analityka Tramwajowa - Czasy Wymiany</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css">
<style>
    /* Domyślny styl bazowy (Desktop) */
    .analytics-control {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 8px 14px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    select.line-select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        outline: none;
        background: #fff;
    }

    .btn-nav-leaderboard {
        text-decoration: none;
        background: #0284c7;
        color: #ffffff;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        white-space: nowrap;
    }

    /* ================= Responsywny pasek na Smartfonie ================= */
    @media (max-width: 640px) {
        .analytics-control {
            top: 10px;
            left: 10px;
            /* Zostawiamy 56px z prawej strony na przycisk lokalizacji GPS MapLibre */
            right: 56px;
            padding: 6px 10px;
            gap: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px; /* Stała, niska wysokość uniemożliwiająca rozciąganie */
            box-sizing: border-box;
        }

        /* Ukrywamy napis "Widok:", sam dropdown mówi za siebie */
        .analytics-control label {
            display: none;
        }

        select.line-select {
            padding: 4px 6px;
            font-size: 13px;
            max-width: 125px;
            flex-shrink: 0;
        }

        /* Licznik peronów: zwarty, jednoliniowy, nie łamie się na 3 wiersze */
        #stats-summary {
            font-size: 11px !important;
            color: #475569;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
            flex-grow: 1;
            text-align: center;
        }

        .btn-nav-leaderboard {
            padding: 5px 8px;
            font-size: 11px;
            flex-shrink: 0;
        }
    }
</style>
</head>
<body>
    <div class="analytics-control glass-panel">
        <label for="line-picker"><b>Widok:</b></label>
        <select id="line-picker" class="line-select">
            <option value="ALL">Wszystkie perony</option>
        </select>
        <span id="stats-summary" style="font-size: 13px; color: #475569;">Pobieranie peronów...</span>
        <a href="/" class="btn-nav-leaderboard">Powrót do mapy</a>
    </div>

    <div id="map" style="width: 100vw; height: 100vh;"></div>

    <script type="module">
        let globalDwellData = null;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [21.012, 52.230],
            zoom: 12.0
        });

        window.gisMap = map;

        // Kontrolka lokalizacji użytkownika (GPS)
        const geolocate = new maplibregl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: true,
            showUserLocation: true,
            showAccuracyCircle: true
        });
        map.addControl(geolocate, 'top-right');

        function updateSummary(count) {
            const el = document.getElementById('stats-summary');
            if (el) el.innerText = `Obsłużone perony: ${count}`;
        }

        function renderDataOnMap() {
            const source = map.getSource('dwell-stats');
            if (source && globalDwellData) {
                source.setData(globalDwellData);
                updateSummary(globalDwellData.features?.length || 0);
            }
        }

        function filterByLine(selectedLine) {
            const source = map.getSource('dwell-stats');
            if (!globalDwellData || !source) return;

            if (selectedLine === 'ALL') {
                source.setData(globalDwellData);
                updateSummary(globalDwellData.features.length);
                return;
            }

            const filteredFeatures = globalDwellData.features.filter(f => {
                let lines = [];
                try {
                    lines = typeof f.properties.lines_json === 'string' 
                        ? JSON.parse(f.properties.lines_json) 
                        : (f.properties.lines_json || []);
                } catch(e) { lines = []; }
                return lines.some(l => String(l.line) === String(selectedLine));
            });

            source.setData({
                type: 'FeatureCollection',
                features: filteredFeatures
            });

            const el = document.getElementById('stats-summary');
            if (el) el.innerText = `Perony linii ${selectedLine}: ${filteredFeatures.length}`;
        }

        async function initData() {
            try {
                const res = await fetch('/network/tram/dwells/all-stops');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                globalDwellData = await res.json();

                renderDataOnMap();

                const allLines = new Set();
                globalDwellData.features.forEach(f => {
                    try {
                        const lines = typeof f.properties.lines_json === 'string' 
                            ? JSON.parse(f.properties.lines_json) 
                            : (f.properties.lines_json || []);
                        lines.forEach(l => allLines.add(String(l.line)));
                    } catch(e) {}
                });

                const picker = document.getElementById('line-picker');
                picker.innerHTML = '<option value="ALL">Wszystkie perony</option>';
                Array.from(allLines).sort((a, b) => parseInt(a) - parseInt(b)).forEach(line => {
                    const opt = document.createElement('option');
                    opt.value = line;
                    opt.innerText = `Linia ${line}`;
                    picker.appendChild(opt);
                });

                picker.addEventListener('change', () => filterByLine(picker.value));
            } catch (err) {
                console.error("Błąd pobierania danych:", err);
                const el = document.getElementById('stats-summary');
                if (el) el.innerText = 'Błąd wczytywania danych';
            }
        }

        initData();

        map.on('load', () => {
            // Torowiska
            map.addSource('tram-network', { type: 'geojson', data: '/network/tram' });
            map.addLayer({
                id: 'tram-tracks',
                type: 'line',
                source: 'tram-network',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: {
                    'line-color': '#64748b',
                    'line-width': 2.0,
                    'line-opacity': 0.6
                }
            });

            // Źródło postojów
            map.addSource('dwell-stats', {
                type: 'geojson',
                data: globalDwellData || { type: 'FeatureCollection', features: [] }
            });

            renderDataOnMap();

            // Kółka postojów
            map.addLayer({
                id: 'dwell-circles',
                type: 'circle',
                source: 'dwell-stats',
                paint: {
                    'circle-radius': [
                        'interpolate', ['linear'], ['coalesce', ['get', 'avg_dwell_sec'], 15],
                        15, 6,
                        35, 10,
                        60, 15,
                        120, 22
                    ],
                    'circle-color': [
                        'interpolate', ['linear'], ['coalesce', ['get', 'avg_dwell_sec'], 20],
                        20, '#2ecc71',
                        35, '#f1c40f',
                        55, '#e67e22',
                        80, '#e74c3c'
                    ],
                    'circle-opacity': 0.85,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Nazwy peronów
            map.addLayer({
                id: 'dwell-stop-names',
                type: 'symbol',
                source: 'dwell-stats',
                minzoom: 10.5,
                layout: {
                    'text-field': ['get', 'stop_name'],
                    'text-size': [
                        'interpolate', ['linear'], ['zoom'],
                        11, 9,
                        14, 12
                    ],
                    'text-offset': [0, 1.4],
                    'text-anchor': 'top',
                    'text-max-width': 8,
                    'text-allow-overlap': false
                },
                paint: {
                    'text-color': '#0f172a',
                    'text-halo-color': '#ffffff',
                    'text-halo-width': 2.5
                }
            });

            // Wartość sekundowa
            map.addLayer({
                id: 'dwell-seconds-label',
                type: 'symbol',
                source: 'dwell-stats',
                minzoom: 12.5,
                layout: {
                    'text-field': ['concat', ['to-string', ['get', 'avg_dwell_sec']], 's'],
                    'text-size': 10,
                    'text-offset': [0, -1.4],
                    'text-anchor': 'bottom',
                    'text-allow-overlap': false
                },
                paint: {
                    'text-color': '#334155',
                    'text-halo-color': '#ffffff',
                    'text-halo-width': 1.5
                }
            });

            // Interakcja
            map.on('click', 'dwell-circles', (e) => {
                const p = e.features[0].properties;
                let lines = [];
                try {
                    lines = typeof p.lines_json === 'string' ? JSON.parse(p.lines_json) : (p.lines_json || []);
                } catch (err) { lines = []; }

                const linesHtml = lines.length > 0 
                    ? lines.map(l => `
                        <div style="display: flex; justify-content: space-between; gap: 14px; margin-top: 4px; font-size: 12px;">
                            <span>Linia <b>${l.line}</b> (${l.samples} kursów):</span>
                            <b>${l.avg_dwell_sec} s</b>
                        </div>
                    `).join('')
                    : '<div style="font-size: 12px; color: #94a3b8;">Brak podziału na linie</div>';

                new maplibregl.Popup({ offset: 8 })
                    .setLngLat(e.features[0].geometry.coordinates)
                    .setHTML(`
                        <div style="font-weight: 700; font-size: 14px;">${p.stop_name}</div>
                        <div style="font-size: 12px; color: #64748b; margin-bottom: 6px;">Zespół: ${p.cluster_name || '–'}</div>
                        <div style="margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; font-size: 13px;">
                            Średni czas postoju: <b>${p.avg_dwell_sec} s</b><br>
                            Łącznie kursów: <b>${p.samples_count}</b>
                        </div>
                        <div style="font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 2px;">Linie na peronie:</div>
                        ${linesHtml}
                    `)
                    .addTo(map);
            });

            map.on('mouseenter', 'dwell-circles', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'dwell-circles', () => { map.getCanvas().style.cursor = ''; });
        });
    </script>
</body>
</html>
