<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korytarze Tramwajowe - Czasy Przejazdu</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        #map { width: 100vw; height: 100vh; }
        
        .floating-card {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px 20px;
            width: 350px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        
        .nav-back { 
            display: inline-block; 
            font-size: 12px; 
            color: #94a3b8; 
            text-decoration: none; 
            margin-bottom: 8px; 
            font-weight: 500;
        }
        .nav-back:hover { color: #38bdf8; }
        
        h3 { 
            margin: 0 0 14px 0; 
            font-size: 16px; 
            font-weight: 700; 
            color: #38bdf8; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .input-group { margin-bottom: 12px; }
        label { 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            color: #94a3b8; 
            margin-bottom: 5px; 
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #38bdf8; 
            background: rgba(255, 255, 255, 0.12);
        }
        select option { background: #0f172a; color: #fff; }
        
        button#btn-calculate {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }
        button#btn-calculate:hover { background: #0369a1; }
        button#btn-calculate:disabled { 
            background: #475569; 
            cursor: not-allowed; 
            opacity: 0.8;
        }

        .result-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 13px;
        }
        .time-badge { 
            font-size: 28px; 
            font-weight: 800; 
            color: #4ade80; 
            margin: 4px 0 2px 0; 
            letter-spacing: -0.5px;
        }
        .meta-info { font-size: 12px; color: #94a3b8; }
        
        /* Baner strat na sygnalizacji */
        .delay-loss-box {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 6px;
            padding: 7px 10px;
            margin-top: 8px;
            font-size: 11px;
            color: #fde68a;
            line-height: 1.4;
        }

        .confidence-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            margin-top: 4px;
        }
        .conf-low { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .conf-high { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }

        .line-tag {
            display: inline-block;
            background: #581c87;
            color: #f3e8ff;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            margin-right: 6px;
        }

        @media (max-width: 640px) {
            .floating-card {
                top: 12px;
                left: 12px;
                right: 12px;
                width: calc(100vw - 24px);
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

<div class="floating-card">
    <a href="/map" class="nav-back">&larr; Wróć do mapy głównej</a>
    <h3>⏱️ Korytarz Tramwajowy</h3>
    
    <div class="input-group">
        <label>Przystanek początkowy (start)</label>
        <input list="clusters-list" id="from-stop" placeholder="Wpisz lub wybierz..." autocomplete="off">
    </div>
    
    <div class="input-group">
        <label>Przystanek docelowy (meta)</label>
        <input list="clusters-list" id="to-stop" placeholder="Wpisz lub wybierz..." autocomplete="off">
    </div>

    <datalist id="clusters-list"></datalist>

    <div class="input-group">
        <label>Linia tramwajowa</label>
        <select id="line-select">
            <option value="">Wszystkie linie na trasie</option>
        </select>
    </div>

    <button id="btn-calculate" onclick="calculateTravelTime()">Wyznacz czas przejazdu</button>

    <div id="result" class="result-box" style="display: none;">
        <div class="meta-info" id="corridor-title"></div>
        <div class="time-badge" id="avg-time">-- min</div>
        <div id="confidence-badge"></div>
        
        <!-- Wskaźnik strat sygnalizacji -->
        <div id="traffic-loss-alert" class="delay-loss-box" style="display: none;"></div>

        <div class="meta-info" id="samples-info" style="margin-top: 6px;"></div>
        <div id="lines-breakdown" style="margin-top: 8px;"></div>
    </div>
</div>

<div id="map"></div>

<script>
    let clusterCoords = {};
    let animationFrameId = null;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [21.0122, 52.2297],
        zoom: 12
    });

    map.on('load', () => {
        // Tło torowisk
        map.addSource('tram-network', { type: 'geojson', data: '/network/tram' });
        map.addLayer({
            id: 'tram-tracks',
            type: 'line',
            source: 'tram-network',
            paint: { 'line-color': '#7030a0', 'line-width': 2.0, 'line-opacity': 0.35 }
        });

        // Ścieżka korytarza (linia połączenia)
        map.addSource('corridor-path', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
            id: 'corridor-glow',
            type: 'line',
            source: 'corridor-path',
            paint: { 'line-color': '#00f2fe', 'line-width': 6, 'line-opacity': 0.5 }
        });
        map.addLayer({
            id: 'corridor-core',
            type: 'line',
            source: 'corridor-path',
            paint: { 'line-color': '#38bdf8', 'line-width': 3 }
        });

        // Źródło i warstwy dla animacji jadącego wagonu/impulsu
        map.addSource('animated-tram-dot', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
            id: 'animated-tram-glow',
            type: 'circle',
            source: 'animated-tram-dot',
            paint: {
                'circle-radius': 14,
                'circle-color': '#38bdf8',
                'circle-opacity': 0.4
            }
        });
        map.addLayer({
            id: 'animated-tram-center',
            type: 'circle',
            source: 'animated-tram-dot',
            paint: {
                'circle-radius': 6,
                'circle-color': '#ffffff',
                'circle-stroke-width': 2,
                'circle-stroke-color': '#0284c7'
            }
        });

        // Punkty Start i Meta
        map.addSource('corridor-points', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
            id: 'corridor-markers',
            type: 'circle',
            source: 'corridor-points',
            paint: {
                'circle-radius': 7,
                'circle-color': ['get', 'color'],
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff'
            }
        });

        loadClusters();
    });

    async function loadClusters() {
        try {
            const res = await fetch('/network/tram/dwells/clusters');
            const data = await res.json();
            const datalist = document.getElementById('clusters-list');
            datalist.innerHTML = (data.clusters || []).map(c => `<option value="${c}">`).join('');

            const platformsRes = await fetch('/network/tram');
            const platformsData = await platformsRes.json();
            (platformsData.features || []).forEach(f => {
                const name = f.properties?.cluster_name || f.properties?.name;
                if (name && f.geometry?.coordinates) {
                    const coords = f.geometry.type === 'Point' 
                        ? f.geometry.coordinates 
                        : f.geometry.coordinates[0];
                    if (!clusterCoords[name.toLowerCase()]) {
                        clusterCoords[name.toLowerCase()] = coords;
                    }
                }
            });

            const fromEl = document.getElementById('from-stop');
            const toEl = document.getElementById('to-stop');
            fromEl.value = 'Mangalia';
            toEl.value = 'Dolna';

            fromEl.addEventListener('change', updateAvailableLines);
            toEl.addEventListener('change', updateAvailableLines);

            updateAvailableLines();
        } catch (e) {
            console.error("Błąd ładowania przystanków:", e);
        }
    }

    async function updateAvailableLines() {
        const fromStop = document.getElementById('from-stop').value.trim();
        const toStop = document.getElementById('to-stop').value.trim();
        const select = document.getElementById('line-select');

        const previousSelection = select.value;
        select.innerHTML = '<option value="">Wszystkie linie na trasie</option>';

        if (!fromStop || !toStop) return;

        try {
            const res = await fetch(`/network/tram/corridor/lines?from_stop=${encodeURIComponent(fromStop)}&to_stop=${encodeURIComponent(toStop)}`);
            if (!res.ok) return;
            const data = await res.json();

            (data.lines || []).forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = `Linia ${l}`;
                if (l === previousSelection) opt.selected = true;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error("Błąd linii korytarza:", e);
        }
    }

    async function calculateTravelTime() {
        const fromStop = document.getElementById('from-stop').value.trim();
        const toStop = document.getElementById('to-stop').value.trim();
        const lineVal = document.getElementById('line-select').value.trim();
        const btn = document.getElementById('btn-calculate');
        const resultBox = document.getElementById('result');
        const lossAlert = document.getElementById('traffic-loss-alert');

        if (!fromStop || !toStop) {
            alert("Wybierz oba zespoły przystankowe z listy!");
            return;
        }

        btn.disabled = true;
        const oldText = btn.innerText;
        btn.innerText = "Przeliczanie przelotów...";

        const params = new URLSearchParams({ from_stop: fromStop, to_stop: toStop });
        if (lineVal && lineVal !== "ALL" && !lineVal.includes("Wszystkie")) {
            params.append("line", lineVal);
        }

        try {
            const res = await fetch(`/network/tram/travel-time?${params.toString()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            resultBox.style.display = 'block';

            if (!data.total_samples || data.total_samples === 0) {
                document.getElementById('corridor-title').innerText = `${fromStop} ➔ ${toStop}`;
                document.getElementById('avg-time').innerText = "Brak danych";
                document.getElementById('avg-time').style.color = '#f87171';
                document.getElementById('confidence-badge').innerHTML = '';
                document.getElementById('samples-info').innerText = "Brak zarejestrowanych bezpośrednich kursów.";
                document.getElementById('lines-breakdown').innerHTML = '';
                lossAlert.style.display = 'none';
                stopAnimation();
                return;
            }

            document.getElementById('corridor-title').innerText = `${data.from_stop} ➔ ${data.to_stop}`;
            document.getElementById('avg-time').innerText = `~ ${data.overall_avg_min} min`;
            document.getElementById('avg-time').style.color = '#4ade80';

            // Zestawienie strat na sygnalizacji (Różnica max vs avg)
            let maxRecorded = null;
            (data.lines || []).forEach(l => {
                if (l.max_time_min && (!maxRecorded || l.max_time_min > maxRecorded)) {
                    maxRecorded = l.max_time_min;
                }
            });

            if (maxRecorded && maxRecorded > data.overall_avg_min) {
                const diffMin = (maxRecorded - data.overall_avg_min).toFixed(1);
                lossAlert.innerHTML = `🚦 <b>Wpływ sygnalizacji i szczytu:</b><br>W trudnych warunkach czas wzrasta do <b>${maxRecorded}m</b> (+${diffMin} min straty na światłach i skrzyżowaniach).`;
                lossAlert.style.display = 'block';
            } else {
                lossAlert.style.display = 'none';
            }

            const confEl = document.getElementById('confidence-badge');
            if (data.total_samples < 8) {
                confEl.innerHTML = `<span class="confidence-tag conf-low">⚠️ Wstępny szacunek (${data.total_samples} przeloty)</span>`;
            } else {
                confEl.innerHTML = `<span class="confidence-tag conf-high">✓ Zweryfikowana próba</span>`;
            }

            document.getElementById('samples-info').innerText = `Łączna próba: ${data.total_samples} zarejestrowanych przelotów`;

            let linesHtml = '';
            (data.lines || []).forEach(l => {
                linesHtml += `
                    <div style="margin-top: 5px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <span class="line-tag">${l.line}</span> 
                            <b>${l.avg_time_min} min</b>
                        </div>
                        <span style="font-size: 11px; color: #94a3b8;">${l.samples} kursów (min: ${l.min_time_min}m, max: ${l.max_time_min}m)</span>
                    </div>`;
            });
            document.getElementById('lines-breakdown').innerHTML = linesHtml;

            // Rysowanie i płynna animacja przelotu po trasie
            highlightAndAnimateRoute(fromStop, toStop);

        } catch (err) {
            console.error(err);
            resultBox.style.display = 'block';
            document.getElementById('avg-time').innerText = "Błąd";
            document.getElementById('avg-time').style.color = '#f87171';
            document.getElementById('samples-info').innerText = "Nie udało się pobrać danych trasy.";
            stopAnimation();
        } finally {
            btn.disabled = false;
            btn.innerText = oldText;
        }
    }

    function stopAnimation() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (map.getSource('animated-tram-dot')) {
            map.getSource('animated-tram-dot').setData({ type: 'FeatureCollection', features: [] });
        }
        if (map.getSource('corridor-path')) {
            map.getSource('corridor-path').setData({ type: 'FeatureCollection', features: [] });
        }
    }

    function highlightAndAnimateRoute(fromStop, toStop) {
        stopAnimation();

        const c1 = clusterCoords[fromStop.toLowerCase()];
        const c2 = clusterCoords[toStop.toLowerCase()];

        if (!c1 || !c2) return;

        // Oznaczenie punktów A i B
        if (map.getSource('corridor-points')) {
            map.getSource('corridor-points').setData({
                type: 'FeatureCollection',
                features: [
                    { type: 'Feature', geometry: { type: 'Point', coordinates: c1 }, properties: { name: fromStop, color: '#22c55e' } },
                    { type: 'Feature', geometry: { type: 'Point', coordinates: c2 }, properties: { name: toStop, color: '#ef4444' } }
                ]
            });
        }

        // Rysowanie linii korytarza
        if (map.getSource('corridor-path')) {
            map.getSource('corridor-path').setData({
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates: [c1, c2]
                }
            });
        }

        // Dopasowanie widoku kamery
        const bounds = new maplibregl.LngLatBounds();
        bounds.extend(c1);
        bounds.extend(c2);
        map.fitBounds(bounds, { padding: { top: 80, bottom: 80, left: 380, right: 80 }, maxZoom: 14, duration: 1000 });

        // Animacja impulsu przemieszczającego się z c1 do c2 w pętli
        const duration = 2400; // czas jednego przelotu w ms
        let startTime = null;

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = ((timestamp - startTime) % duration) / duration;

            // Interpolacja liniowa współrzędnych [lng, lat]
            const currentLng = c1[0] + (c2[0] - c1[0]) * progress;
            const currentLat = c1[1] + (c2[1] - c1[1]) * progress;

            if (map.getSource('animated-tram-dot')) {
                map.getSource('animated-tram-dot').setData({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [currentLng, currentLat]
                    }
                });
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        animationFrameId = requestAnimationFrame(animate);
    }
</script>
</body>
</html>
