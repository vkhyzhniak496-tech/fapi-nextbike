<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warszawa - Veturilo & Tram Analytics</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Styl dla przycisków nawigacyjnych w panelu statusu */
        .nav-buttons-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-nav-primary {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            transition: background 0.2s;
        }
        .btn-nav-primary:hover {
            background: #0369a1;
        }
        .btn-nav-tram-corridor {
            display: inline-block;
            background: #7c3aed;
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
        }
        .btn-nav-tram-corridor:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>
<div id="info-box" class="glass-panel">
        <div class="status-row">
            <span class="pulse"></span>
            <span>Veturilo 3.0 Live</span>
        </div>
        <div class="update-time">Aktualizacja: <span id="last-update-label">Ładowanie...</span></div>
        
        <div class="nav-actions">
            <a href="/analytics/tram" class="btn-nav-tram">Tramy</a>
            <a href="/analytics/tram-corridor" class="btn-nav-corridor">Korytarze</a>
        </div>
    </div>

    <button id="btn-toggle-filters" class="fab-filters" aria-label="Filtry warstw">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
    </button>

    <!-- Dolny wysuwany arkusz (Bottom Sheet) -->
    <div id="legend" class="glass-panel">
        <div class="legend-header-mobile">
            <div class="legend-title" style="margin: 0;">Filtruj infrastrukturę</div>
            <button class="btn-close-mobile">&times;</button>
        </div>

        <label class="legend-row">
            <input type="checkbox" id="filter-ddr" checked>
            <span class="legend-line" style="background: #27ae60;"></span>
            <span class="legend-label">Wydzielona droga (DDR)</span>
        </label>

        <label class="legend-row">
            <input type="checkbox" id="filter-lane" checked>
            <span class="legend-line" style="background: #f39c12;"></span>
            <span class="legend-label">Pas rowerowy w jezdni</span>
        </label>

        <label class="legend-row">
            <input type="checkbox" id="filter-woonerf" checked>
            <span class="legend-line" style="background: #2980b9;"></span>
            <span class="legend-label">Strefa zamieszkania / Woonerf</span>
        </label>

        <label class="legend-row">
            <input type="checkbox" id="filter-tempo30" checked>
            <span class="legend-line" style="background: #3498db;"></span>
            <span class="legend-label">Ulica Tempo 30 (uspokojona)</span>
        </label>

        <label class="legend-row">
            <input type="checkbox" id="filter-trams" checked>
            <span class="legend-line" style="background: #3b0141;"></span>
            <span class="legend-label">Torowiska tramwajowe</span>
        </label>
    </div>

    <script type="module" src="/static/js/map_view.js"></script>
</body>
</html>
